```yaml
# Filename: projdev.yaml
# Version: 0.91
# Updated at: feature start, item open, commit/push, item close, feature end.

# repo
project:
  owner: pashute
  repo: aiSpecsDev

# project management (github project board)
projman:
  id:          # project number (typically single digit)
  name:        # project name
  uid:         # project uid
  url:         # https://github.com/users/<owner>/projects/<num>

# feature (gitflow)
feature:
  name:         # e.g. myfeature
  branch:       # e.g. feature/myfeature
  item:         # the feature item (parent issue)
    id: 2        # issue number, not uid
    title: feature/WriteSomeSpecs
    url: https://github.com/pashute/aiSpecsDev/issues/2
    state: open
    stage:         # should be In-progress.
    milestone:
    date:

# active_item: current item being worked on.
active_item:
  id: 2         # issue number, not uid
  title: feature/WriteSomeSpecs
  url: https://github.com/pashute/aiSpecsDev/issues/2
  state: open
  stage:         # workflow stage
  milestone:
  date:
  subtasks: 
  - id: 7 title: "" url: "" state: "" stage: "" milestone: "" date: ""
  - id: 5 title: "" url: "" state: "" stage: "" milestone: "" date: ""
  - id: 3 title: "" url: "" state: "" stage: "" milestone: "" date: ""
  - id: 6 title: "" url: "" state: "" stage: "" milestone: "" date: ""
  - id: 4 title: "" url: "" state: "" stage: "" milestone: "" date: ""

# parent_item: immediate parent. empty if active_item is the feature item itself
parent_item:
  id:
  title:
  url:
  state:
  stage:
  milestone:
  date: 



# commits: log of all commits in this feature.
#   each commit has: id, headline, details[], filechanges[]
#     each filechange has: filename, path, changes[]
#   details and changes are free text lines
#   example detail:  "line 23. added missing initialization"
#   example change:  "line 44. removed redundant section"
commits:
  - id:
    headline:
    details:
      - ""
    filechanges:
      - filename:
        path:
        changes:
          - ""

# completed_items: closed items in this feature.
# each item has: id, title, status, remarks
completed_items:
  - id:
    title:
    status:
    remarks:
